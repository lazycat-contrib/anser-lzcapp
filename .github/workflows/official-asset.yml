name: Submit official store package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version containing the official-store LPK
        required: true
        type: string
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Verify the official-store Release asset
        id: asset
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          file="community.lazycat.app.anser-v$VERSION-official.lpk"
          gh release download "v$VERSION" --pattern "$file" --dir "$GITHUB_WORKSPACE/dist"
          digest=$(gh release view "v$VERSION" --json assets | jq -er --arg f "$file" '.assets[] | select(.name == $f) | .digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "${digest#sha256:}  $GITHUB_WORKSPACE/dist/$file" | sha256sum --check
          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "path=$GITHUB_WORKSPACE/dist/$file" >> "$GITHUB_OUTPUT"
      - uses: ca-x/lazycat-github-action@v1
        env:
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
          LAZYCAT_GUARD_OFFICIAL_REVIEW: "true"
        with:
          operation: publish-official
          version: ${{ inputs.version }}
          lpk-path: ${{ steps.asset.outputs.path }}
          sha256: ${{ steps.asset.outputs.sha256 }}

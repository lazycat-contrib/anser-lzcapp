application:
  subdomain: anser
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://anser:8080/
  injects:
    - id: anser-device-discovery
      on: request
      auth_required: false
      when:
        - /v1/channels/lazycat/devices
      do: |
        ctx.headers.del("X-Anser-Lazycat-Uid");
        ctx.headers.del("X-Anser-Lazycat-Proof");
        if (ctx.safe_uid) {
          ctx.headers.set("X-Anser-Lazycat-Uid", ctx.safe_uid);
          ctx.headers.set("X-Anser-Lazycat-Proof", "{{ stable_secret "anser_device_discovery_v1" | sha256sum }}");
        }
    - id: anser-admin-login
      on: browser
      auth_required: true
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.admin_username | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
            password: "{{ .U.admin_password | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
            userSelector: 'input[autocomplete="username"]'
            passwordSelector: 'input[autocomplete="current-password"]'
            submitSelector: 'button[type="submit"]'
            formSelector: 'form'
            autoSubmit: true
            submitMode: requestSubmit
    - id: anser-avatar-picker
      on: browser
      auth_required: true
      when:
        - /login
        - /admin
        - /admin/*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            fileBridgeRoot: /__anser_avatar_file
            hooks:
              fileInput: true
              fileSystemAccess: false
              downloadAnchor: false
    - id: anser-avatar-picker-frame
      on: response
      auth_required: true
      when:
        - /login
        - /admin
        - /admin/*
      do: |
        const domain = "{{ .S.AppDomain }}";
        const box = domain.match(/^anser\.([a-z0-9-]+\.heiyu\.space)$/i)?.[1];
        const policy = ctx.headers.get("Content-Security-Policy");
        if (box && policy && ctx.safe_uid) {
          ctx.headers.set("Content-Security-Policy", policy + "; frame-src https://file." + box);
        }
    - id: anser-avatar-file
      on: request
      auth_required: true
      when:
        - /__anser_avatar_file/*
      do: |
        const domain = "{{ .S.AppDomain }}";
        const box = domain.match(/^anser\.([a-z0-9-]+\.heiyu\.space)$/i)?.[1];
        if (!box || !ctx.safe_uid || ctx.headers.get("Sec-Fetch-Site") !== "same-origin"
          || ctx.headers.get("Sec-Fetch-Dest") !== "empty"
          || !["cors", "same-origin"].includes(ctx.headers.get("Sec-Fetch-Mode"))) {
          ctx.response.send(403, "Open the avatar picker from the signed-in Anser app.");
          return;
        }
        if (!["GET", "HEAD"].includes(ctx.request.method)) {
          ctx.response.send(405, "The avatar picker only reads images.");
          return;
        }
        const prefix = "/__anser_avatar_file/";
        const path = ctx.request.path;
        const filename = path.slice(prefix.length);
        if (!path.startsWith(prefix)
          || !/\.(?:png|jpe?g|webp)$/i.test(filename)
          || /[\x00-\x1f\x7f\\?#]|%(?:00|2e|2f|5c|25)/i.test(filename)
          || filename.split("/").some((segment) => !segment || segment === "." || segment === "..")) {
          ctx.response.send(400, "Select a PNG, JPEG or WebP image.");
          return;
        }
        ctx.headers.del("Origin");
        ctx.headers.del("Referer");
        ctx.headers.del("Authorization");
        ctx.proxy.to("https://file." + box, {
          path: "/files/home/" + filename,
          query: "",
          use_target_host: true,
          timeout_ms: 15000,
          on_fail: "error",
        });
services:
  anser:
    # upstream: ghcr.io/ca-x/anser:0.7.2
    image: registry.lazycat.cloud/czyt/ca-x/anser:17c0235046725b43
    run_as: "10001:10001"
    binds:
      - /lzcapp/var:/data
    environment:
      - ANSER_BIND=0.0.0.0:8080
      - ANSER_LAZYCAT_INGRESS_SECRET={{ stable_secret "anser_device_discovery_v1" | sha256sum }}
      - ANSER_LAZYCAT_LEGACY_TLS=1
      - ANSER_DATABASE=/data/anser.sqlite3
      - ANSER_PUBLIC_URL=https://{{ .S.AppDomain }}
      - "ANSER_BOOTSTRAP_USERNAME={{ .U.admin_username | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
      - "ANSER_BOOTSTRAP_PASSWORD={{ .U.admin_password | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
      - "ANSER_OUTBOUND_ALLOW_HOSTS={{ (.U.outbound_allow_hosts | default ``) | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"

application:
  subdomain: anser
  background_task: true
  upstreams:
    - location: /
      backend: http://anser:8080/
  injects:
    - id: anser-device-discovery
      on: request
      auth_required: false
      when:
        - /v1/channels/lazycat/devices
      do: |
        ctx.headers.del("X-Anser-Lazycat-Uid");
        ctx.headers.del("X-Anser-Lazycat-Proof");
        if (ctx.safe_uid) {
          ctx.headers.set("X-Anser-Lazycat-Uid", ctx.safe_uid);
          ctx.headers.set("X-Anser-Lazycat-Proof", "{{ stable_secret "anser_device_discovery_v1" | sha256sum }}");
        }
    - id: anser-admin-login
      on: browser
      auth_required: true
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.admin_username | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
            password: "{{ .U.admin_password | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
            userSelector: 'input[autocomplete="username"]'
            passwordSelector: 'input[autocomplete="current-password"]'
            submitSelector: 'button[type="submit"]'
            formSelector: 'form'
            autoSubmit: true
            submitMode: requestSubmit
services:
  anser:
    # upstream: ghcr.io/ca-x/anser:0.5.1
    image: registry.lazycat.cloud/czyt/ca-x/anser:1b9c063e5ecfe9a2
    run_as: "10001:10001"
    binds:
      - /lzcapp/var:/data
    environment:
      - ANSER_BIND=0.0.0.0:8080
      - ANSER_LAZYCAT_INGRESS_SECRET={{ stable_secret "anser_device_discovery_v1" | sha256sum }}
      - ANSER_DATABASE=/data/anser.sqlite3
      - ANSER_PUBLIC_URL=https://{{ .S.AppDomain }}
      - "ANSER_BOOTSTRAP_USERNAME={{ .U.admin_username | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
      - "ANSER_BOOTSTRAP_PASSWORD={{ .U.admin_password | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"
      - "ANSER_OUTBOUND_ALLOW_HOSTS={{ (.U.outbound_allow_hosts | default ``) | quote | trimPrefix (printf `%c` 34) | trimSuffix (printf `%c` 34) }}"

params:
  - id: admin_username
    type: string
    name: Administrator username
    description: 1 to 64 ASCII letters, digits, dots, underscores or hyphens.
    default_value: admin
    optional: false
  - id: admin_password
    type: secret
    name: Administrator password
    description: Use 8 to 256 UTF-8 bytes. Anser uses this only to initialize a new database.
    default_value: "$random(len=24)"
    optional: false
  - id: outbound_allow_hosts
    type: string
    name: Outbound host allowlist
    description: Comma-separated hostnames or IPs. For an outbound proxy, include both the proxy and destination.
    optional: true
locales:
  zh:
    admin_username:
      name: 管理员用户名
      description: 长度为 1 至 64 个字符，可使用英文字母、数字、点、下划线和短横线。
    admin_password:
      name: 管理员密码
      description: 密码长度为 8 至 256 个 UTF-8 字节，仅用于初始化新数据库。
    outbound_allow_hosts:
      name: 出站主机允许列表
      description: 以逗号分隔主机名或 IP。使用代理时请同时填写代理和通知目标。
